version: '3.7'
services:

  backend:
    container_name: bgt2-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - bgt2-network

  rabbitmq-worker:
    container_name: bgt2-rabbitmq-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: ["sh", "-c", "yarn start:rabbitmq:prod"]
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - bgt2-network

  db:
    container_name: bgt2-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - bgt2-network

  redis:
    container_name: bgt2-redis
    image: redis:5.0
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bgt2-network

  rabbitmq:
    container_name: bgt2-rabbitmq
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bgt2-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  bgt2-network:

