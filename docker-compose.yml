version: '3.7'
services:

  backend:
    container_name: bgt2-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=384
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - bgt2-network
    deploy:
      resources:
        limits:
          memory: 512M

  rabbitmq-worker:
    container_name: bgt2-rabbitmq-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
    command: ["sh", "-c", "yarn start:rabbitmq:prod"]
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - bgt2-network
    deploy:
      resources:
        limits:
          memory: 384M

  db:
    container_name: bgt2-db
    image: postgres:15
    restart: always
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - bgt2-network
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    container_name: bgt2-redis
    image: redis:5.0
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - bgt2-network
    deploy:
      resources:
        limits:
          memory: 192M

  rabbitmq:
    container_name: bgt2-rabbitmq
    image: rabbitmq:3-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bgt2-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  bgt2-network:
