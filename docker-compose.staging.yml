# Staging API на том же VPS, что и prod.
# Требует уже запущенный prod: docker compose up (db, redis, rabbitmq в bgt2-network).
#
# Порты: 8081 (не 8080). БД: budget2_staging в контейнере bgt2-db.

version: "3.7"

services:
  backend-staging:
    container_name: bgt2-backend-staging
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - NODE_OPTIONS=--max-old-space-size=384
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./uploads-staging:/app/uploads
      - ./backups-staging:/app/backups
    networks:
      - bgt2-network
    deploy:
      resources:
        limits:
          memory: 512M
    # depends_on не нужен: db/redis/rabbit уже в сети от prod compose

  # Одноразово: админ + планы FREE/PREMIUM (образ с ts-node, не prod-образ)
  # docker compose -f docker-compose.staging.yml --profile tools run --rm ensure-admin
  ensure-admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ensure-admin
    env_file:
      - .env.staging
    networks:
      - bgt2-network

  # AI upload: backend-staging сам consumer. В .env.staging задайте
  # AI_UPLOAD_QUEUE=ai_upload_queue_staging (см. .env.staging.example).

networks:
  bgt2-network:
    external: true
    name: back_bgt2-network
